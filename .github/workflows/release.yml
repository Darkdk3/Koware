name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach APKs to"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish APKs
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Get release tag
        id: tag
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $tag"
            exit 1
          fi

          echo "name=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
     
      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: koware-debug-keystore-v1

      - name: Build release APKs
        run: ./gradlew clean assembleRelease -Penable-updater

      - name: Rename APKs
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail

          cd app/build/outputs/apk/release

          mv app-universal-release.apk "Koware-$TAG.apk"
          mv app-arm64-v8a-release.apk "Koware-arm64-v8a-$TAG.apk"
          mv app-armeabi-v7a-release.apk "Koware-armeabi-v7a-$TAG.apk"
          mv app-x86-release.apk "Koware-x86-$TAG.apk"
          mv app-x86_64-release.apk "Koware-x86_64-$TAG.apk"

      - name: Upload APKs to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: |
            app/build/outputs/apk/release/Koware-${{ steps.tag.outputs.name }}.apk
            app/build/outputs/apk/release/Koware-arm64-v8a-${{ steps.tag.outputs.name }}.apk
            app/build/outputs/apk/release/Koware-armeabi-v7a-${{ steps.tag.outputs.name }}.apk
            app/build/outputs/apk/release/Koware-x86-${{ steps.tag.outputs.name }}.apk
            app/build/outputs/apk/release/Koware-x86_64-${{ steps.tag.outputs.name }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
