name: Build & Test App

on:
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!fastlane/**'
      - '!i18n/src/commonMain/moko-resources/**/strings.xml'
      - '!i18n/src/commonMain/moko-resources/**/plurals.xml'
      - 'i18n/src/commonMain/moko-resources/base/strings.xml'
      - 'i18n/src/commonMain/moko-resources/base/plurals.xml'
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed so this fork's own release step (below) can publish releases

jobs:
  build:
    name: Build, Test & (on main) Sign APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

      - name: Count Commits
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'tsundoku-otaku/tsundoku'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git rev-list --count HEAD
          commit_count=$(git rev-list --count HEAD)
          echo "COMMIT_COUNT=$commit_count" >> $GITHUB_ENV

      - name: Verify Commit Count
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'tsundoku-otaku/tsundoku'
        run: |
          set -e
          echo "${{ env.COMMIT_COUNT }}"
          test ${{ env.COMMIT_COUNT }} -gt 1 || exit 1

      - name: Count Commits (this fork)
        # The in-app updater compares the release tag number against the app's
        # COMMIT_COUNT, so the tag must be the git commit count, not the run number.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository != 'tsundoku-otaku/tsundoku'
        run: |
          set -e
          commit_count=$(git rev-list --count HEAD)
          echo "$commit_count"
          echo "COMMIT_COUNT=$commit_count" >> $GITHUB_ENV

      - name: Generate release notes (this fork)
        # Notes = commit titles since the last published release. GitHub's default
        # titles ("Update Foo.kt", "Create Foo.kt", "Delete Foo.kt") are skipped.
        # The same notes are (1) baked into the APK for the "What's new" dialog and
        # (2) used as the release body, which the update dialog shows.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository != 'tsundoku-otaku/tsundoku'
        run: |
          set -e
          prev_tag=$(git tag --list 'r[0-9]*' --sort=-version:refname | head -n 1)
          if [ -n "$prev_tag" ]; then
            range="$prev_tag..HEAD"
          else
            range="-n 15"
          fi
          git log --no-merges --pretty='- %s' $range \
            | grep -viE '^- (Update|Create|Delete) [^ ]+$' \
            | head -n 30 > notes.md || true
          if [ ! -s notes.md ]; then
            echo "- Internal changes and fixes" > notes.md
          fi
          mkdir -p app/src/main/assets
          cp notes.md app/src/main/assets/whatsnew.md
          {
            cat notes.md
            echo
            echo '<!-->'
            echo
            echo "Automated nightly build from commit ${GITHUB_SHA}."
            echo
            echo "Signed with Android's default debug keystore (this fork doesn't have"
            echo "the upstream signing secrets) — installable, but Android will treat"
            echo "it as a different signing identity than any store-signed version."
          } > release_body.md
          cat release_body.md

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Cache debug keystore
        # Without this, GitHub's ephemeral runners generate a brand-new random
        # debug keystore on every single run, so every nightly build ends up
        # signed with a different key. Android refuses to install an "update"
        # whose signature doesn't match what's already installed, so without
        # this cache, every build would still force an uninstall/reinstall -
        # this is what actually makes in-place updates possible.
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Build release APK(s) (unsigned)
        run: ./gradlew assembleNightly -Penable-updater

      - name: Upload unsigned APK(s)
        uses: actions/upload-artifact@v5
        with:
          name: tsundoku-nightly-unsigned-${{ github.sha }}
          path: app/build/outputs/apk/nightly/*.apk

      - name: Run unit tests
        id: unit_tests
        run: ./gradlew testDebugUnitTest

      - name: Verify SQLDelight migrations
        run: ./gradlew verifySqlDelightMigration

      - name: Upload test report (if tests fail)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-report-${{ github.sha }}
          path: app/build/reports/tests/testDebugUnitTest

      - name: Sign APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'tsundoku-otaku/tsundoku'
        uses: r0adkll/sign-android-release@f30bdd30588842ac76044ecdbd4b6d0e3e813478
        with:
          releaseDirectory: app/build/outputs/apk/nightly
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Clean up build artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'tsundoku-otaku/tsundoku'
        run: |
          set -e
          mv app/build/outputs/apk/nightly/app-universal-nightly-signed.apk tsundoku-r${{ env.COMMIT_COUNT }}.apk
          mv app/build/outputs/apk/nightly/app-arm64-v8a-nightly-signed.apk tsundoku-arm64-v8a-r${{ env.COMMIT_COUNT }}.apk
          mv app/build/outputs/apk/nightly/app-armeabi-v7a-nightly-signed.apk tsundoku-armeabi-v7a-r${{ env.COMMIT_COUNT }}.apk
          mv app/build/outputs/apk/nightly/app-x86-nightly-signed.apk tsundoku-x86-r${{ env.COMMIT_COUNT }}.apk
          mv app/build/outputs/apk/nightly/app-x86_64-nightly-signed.apk tsundoku-x86_64-r${{ env.COMMIT_COUNT }}.apk

      - name: Upload signed APKs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'tsundoku-otaku/tsundoku'
        uses: actions/upload-artifact@v5
        with:
          name: signed-apks-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk

      - name: Create release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'tsundoku-otaku/tsundoku'
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          repository: tsundoku-otaku/tsundoku-nightly
          tag_name: r${{ env.COMMIT_COUNT }}
          name: Tsundoku Nightly r${{ env.COMMIT_COUNT }}
          body: |
            All Hope Abandon Ye Who Enter Here

            <!-->

            > [!TIP]
            >
            > ### If you are unsure which version to download then go with `tsundoku-r${{ env.COMMIT_COUNT }}.apk`
          files: |
            tsundoku-r${{ env.COMMIT_COUNT }}.apk
            tsundoku-arm64-v8a-r${{ env.COMMIT_COUNT }}.apk
            tsundoku-armeabi-v7a-r${{ env.COMMIT_COUNT }}.apk
            tsundoku-x86-r${{ env.COMMIT_COUNT }}.apk
            tsundoku-x86_64-r${{ env.COMMIT_COUNT }}.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.TSUNDOKU_BOT_TOKEN }}

      - name: Prune old releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'tsundoku-otaku/tsundoku'
        uses: dev-drprasad/delete-older-releases@dfbe6be2a006e9475dfcbe5b8d201f1824c2a9fe # v0.3.4
        env:
          GITHUB_TOKEN: ${{ secrets.TSUNDOKU_BOT_TOKEN }}
        with:
          repo: tsundoku-otaku/tsundoku-nightly
          keep_latest: 28
          delete_tags: true

      - name: Create release (this fork)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository != 'tsundoku-otaku/tsundoku'
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: r${{ env.COMMIT_COUNT }}
          target_commitish: ${{ github.sha }}
          name: Koware Nightly r${{ env.COMMIT_COUNT }}
          # Everything before the <!--> marker (the generated notes) is what the
          # in-app update dialog shows.
          body_path: release_body.md
          files: app/build/outputs/apk/nightly/*.apk
          # Must NOT be a pre-release: the app uses GitHub's /releases/latest,
          # which ignores pre-releases.
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune old releases (this fork)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository != 'tsundoku-otaku/tsundoku'
        uses: dev-drprasad/delete-older-releases@dfbe6be2a006e9475dfcbe5b8d201f1824c2a9fe # v0.3.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          keep_latest: 10
          delete_tags: true

      - name: Cleanup keystore
        if: always()
        run: rm -f release.keystore